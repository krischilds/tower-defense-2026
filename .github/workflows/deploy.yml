name: Build and deploy

on:
  push:
    branches: [master, 'release*', 'release*/**']
  pull_request:
    branches: [master, 'release*', 'release*/**']
  workflow_dispatch:
    inputs:
      environment:
        description: Choose the target; prod deployment is not configured yet
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
      )
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: dev
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
