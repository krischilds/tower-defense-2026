name: Build and deploy

on:
  push:
    branches: [master, 'release*', 'release*/**']
  pull_request:
    branches: [master, 'release*', 'release*/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify release branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/release*) ;;
            *) echo "Deployment requires a branch beginning with release" >&2; exit 1 ;;
          esac
      - id: deployment
        uses: actions/deploy-pages@v4
